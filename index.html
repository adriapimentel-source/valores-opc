*,*::before,*::after{box-sizing:border-box}

/* ── Fluid font scale ──────────────────────────────────────────
   clamp(min, preferred, max)
   mobile  : ~18px
   notebook: ~19–20px
   desktop : 20px cap
──────────────────────────────────────────────────────────────── */
html{font-size:clamp(17px, 1.5vw, 20px)}

body{margin:0;background:#F5EFE4;overflow-x:hidden}
*{font-family:'Atkinson Hyperlegible','Verdana',sans-serif;letter-spacing:.03em;word-spacing:.06em;line-height:1.75}
:focus-visible{outline:3px solid #B8862B;outline-offset:3px;border-radius:4px}
:focus:not(:focus-visible){outline:none}
button{min-height:48px;cursor:pointer;border:none}
input{font-family:'Atkinson Hyperlegible','Verdana',sans-serif}
input::placeholder,textarea::placeholder{color:#7A8689}
input,textarea{font-family:'Atkinson Hyperlegible','Verdana',sans-serif}
h1,h2,h3{font-family:'Alegreya',Georgia,serif;letter-spacing:0;word-spacing:0;line-height:1.2}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.print-only{display:none}
#resultado-pdf{display:none}
.pagina{max-width:min(600px,96vw)}
@media(min-width:900px){.pagina{max-width:840px}.pagina-larga{max-width:min(1100px,96vw)}}
.partes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:900px){.partes{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pvq-opcoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media(min-width:520px){.pvq-opcoes{grid-template-columns:repeat(4,minmax(0,1fr))}}
.eixos-mapa{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:480px){.eixos-mapa{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:960px){.mapa-layout{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:32px;align-items:center}}
.top3-grid{display:flex;flex-direction:column;gap:18px}
@media(min-width:1000px){.top3-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}}
.eixos-grid{display:flex;flex-direction:column;gap:20px}
@media(min-width:960px){.eixos-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.leitura{max-width:780px;margin-left:auto;margin-right:auto}
.rel-p{text-align:left}
@media(min-width:640px){.rel-p{text-align:justify}}
@media print{
  @page{size:A4;margin:18mm 16mm}
  body{background:#fff!important}
  body *{visibility:hidden}
  #root *{transform:none!important;filter:none!important;transition:none!important}
  html,body{height:auto!important}
  body[data-print="relatorio"] #relatorio,body[data-print="relatorio"] #relatorio *{visibility:visible}
  body[data-print="relatorio"] #relatorio{position:absolute;left:0;top:0;width:100%;border:none!important;box-shadow:none!important;padding:0!important}
  body[data-print="relatorio"] #resultado-pdf{display:none!important}
  body:not([data-print="relatorio"]) #tela-resultados{display:none!important}
  body:not([data-print="relatorio"]) #resultado-pdf{display:block!important}
  #resultado-pdf,#resultado-pdf *{visibility:visible}
  .quebra{break-before:page}
  .junto{break-inside:avoid}
  .no-print{display:none!important}
  .print-only{display:block!important}
  #relatorio p{orphans:3;widows:3}
  .rel-p{text-align:justify!important}
}

/* ── Tablet / notebook: wider card, bigger breathing room ───── */
@media(min-width:640px){
  html{font-size:clamp(18px,1.4vw,20px)}
}

/* ── Desktop: cap width and center with side padding ─────────  */
@media(min-width:1024px){
  html{font-size:19px}
}

a combinado com a sua família que ia usar esses dias para estudar para uma prova importante. Todo mundo vai.",["Vou! Essa memória vai durar pra sempre.","Fico. Compromisso é compromisso.","Converso com minha família com honestidade e negocio outro arranjo."]],2:["Estudo e Justiça","O Crédito pelo Trabalho","Você fez a maior parte do projeto. Na hora da apresentação…","Na faculdade (ou no estágio), um colega apresentou o trabalho como se tivesse feito tudo. O professor ou gestor elogiou “a equipe”. Você sente um nó no estômago.",["Explico minha contribuição ao professor ou gestor depois.","Deixo passar. A equipe toda se beneficia.","Converso com o colega em particular e digo como me senti."]],3:["Futuro e Carreira","O Curso Certo ou o Curso Desejado","A pergunta “é isso mesmo que você quer?” não sai da cabeça.","Você está num curso que sua família apoia e que costuma dar estabilidade. Mas descobriu um interesse forte por outra área, bem diferente. Você sente que precisa escolher entre segurança e autenticidade.",["Continuo. Estabilidade é fundamental. Posso me adaptar depois.","Troco de área. Minha paixão não tem preço. Vou arriscar.","Pesquiso caminhos que unam o que curso hoje e o que me interessa."]],4:["Solidariedade","O Colega em Dificuldade","Você descobre algo que quase ninguém sabe.","Um colega da faculdade ou do curso está passando fome e pensa em desistir por falta de dinheiro. Não pediu ajuda a ninguém. Você pode agir, mas exige tempo e energia.",["Organizo uma vaquinha discreta com amigos para ajudar.","Abordo essa pessoa com respeito e ofereço minha ajuda diretamente.","Aviso discretamente à coordenação ou à assistência estudantil."]],5:["Novos Horizontes","A Oportunidade Diferente","Uma chance única aparece, mas com um preço.","Abre uma vaga de intercâmbio ou mobilidade de 6 meses em outra cidade. Nova rotina, novas pessoas, tudo diferente. Você teria que deixar tudo que conhece por um tempo.",["Vou! Experiências assim mudam a vida.","Fico. Meus vínculos aqui são mais importantes agora.","Envolvo minha família na decisão e analisamos juntos."]],6:["Redes Sociais","O Post Problemático","Um post que complicou tudo.","Um post seu viralizou, mas comentários apontam que algo que você disse pode ter ofendido um grupo. O engajamento está alto. O desconforto também.",["Deixo rolar. A maioria curtiu e foi sem querer mesmo.","Apago e faço um pedido de desculpas público.","Respondo os comentários e ouço quem se sentiu ofendido."]]},adulto:{1:["Lazer e Compromisso","O Convite de Última Hora","Fim de semana chegando, e um convite inesperado.","Amigos antigos chamam você para uma viagem de fim de semana, coisa que não acontece há anos. Só que você tinha se comprometido a ajudar sua família com algo importante nesses mesmos dias.",["Vou! Faz tempo que não me permito isso.","Fico. Compromisso é compromisso.","Converso com minha família com honestidade e negocio outro arranjo."]],2:["Trabalho e Justiça","O Crédito pelo Trabalho","Você liderou o projeto. Na reunião com a direção…","Um colega apresentou os resultados como se tivessem sido ideia dele. A liderança elogiou “a equipe”. Você sente um nó no estômago.",["Explico minha contribuição à liderança depois da reunião.","Deixo passar. A equipe toda se beneficia.","Converso com o colega em particular e digo como me senti."]],3:["Futuro e Carreira","A Carreira que Já Tenho","Uma vontade antiga voltou a aparecer.","Você tem anos de experiência numa profissão estável, com reconhecimento. Mas sente vontade de migrar para outra área, bem diferente, que sempre te chamou. Você sente que precisa escolher entre segurança e autenticidade.",["Fico. Estabilidade e o que já conquistei são fundamentais.","Faço a transição, mesmo começando do zero. Vou arriscar.","Pesquiso uma transição gradual que una o que faço hoje e o que desejo."]],4:["Solidariedade","O Colega em Dificuldade","Você descobre algo que quase ninguém sabe.","Um colega de trabalho está passando por dificuldades financeiras sérias, a ponto de faltar comida em casa. Não pediu ajuda a ninguém. Você pode agir, mas exige tempo e energia.",["Organizo uma ajuda discreta com outras pessoas próximas.","Abordo essa pessoa com respeito e ofereço minha ajuda diretamente.","Aviso discretamente ao setor ou serviço que pode dar apoio, como o RH."]],5:["Novos Horizontes","A Oportunidade Diferente","Uma chance única aparece, mas com um preço.","Você recebe a proposta de passar 6 meses num projeto novo e desafiador em outra cidade. Seria uma rotina completamente diferente, longe da casa e das pessoas com quem convive.",["Vou! Experiências assim mudam a vida.","Fico. Meus vínculos aqui são mais importantes agora.","Envolvo minha família na decisão e analisamos juntos."]],6:["Redes e Grupos","A Fala Mal Recebida","Uma mensagem que complicou tudo.","Algo que você escreveu num grupo de trabalho ou nas redes foi entendido como ofensivo por algumas pessoas. Outras concordaram e apoiaram. A repercussão está grande. O desconforto também.",["Deixo pra lá. A maioria entendeu e foi sem querer mesmo.","Apago e faço um pedido de desculpas público.","Respondo as pessoas e ouço quem se sentiu ofendido."]],7:["Carreira · Escolha","Salário ou Sentido","Uma proposta chega no momento em que você menos esperava.","Você recebe uma proposta que paga bem mais, numa área que não faz muito sentido para você. O trabalho atual paga menos, mas tem a ver com o que você valoriza. As contas de casa também pesam.",["Aceito a que paga mais. Com estabilidade, depois eu reorganizo.","Fico com o que faz sentido para mim. Dinheiro se ajeita com o tempo.","Converso com minha família sobre o que é possível agora e decidimos juntos."]],8:["Carreira · Caminhos","O Próximo Passo","Você sente que é hora de mudar algo na carreira.","Uma pessoa próxima sugere estudar para concurso. Outra diz para investir em crescer na empresa onde está ou buscar outra com carteira assinada. Um amigo te chama para abrir um negócio juntos.",["Concurso. Quero estabilidade e segurança para os próximos anos.","Empresa. Quero crescer e me desenvolver dentro de uma organização.","Negócio próprio. Quero criar algo meu, mesmo com risco."]],9:["Carreira · Território","A Proposta em Outro Estado","Uma proposta que muda o mapa da vida.","Você recebe uma ótima proposta de trabalho em outro estado. Aceitar significa sair de perto da família, dos amigos e da rede de apoio que você construiu por aqui.",["Vou. É uma chance de crescer que talvez não apareça de novo.","Fico. Quero continuar construindo minha vida perto de quem amo e contribuir com minha região.","Vou por um tempo, com o plano de voltar e aplicar aqui o que aprender."]]}};function ps(e){let a=Yg[e]||{};return Vg.map(t=>{let l=a[t.id];if(!l)return t;let[i,n,o,u,s]=l;return{...t,badge:i,titulo:n,contexto:o,narrativa:u,opcoes:t.opcoes.map((d,f)=>({...d,t:s[f]}))}})}var zp=(e,a)=>(e.opcoes.find(t=>t.letra===a.letra)||a).t,Ap=(e,a)=>Ep(Nt(a.idade)).find(l=>l.id==="decisao").opts.find(l=>JSON.stringify(l.v)===JSON.stringify(e.v))||e,gp={adolescente:["📋 O que é esperado de mim pela família e escola","o que a família e a escola esperam"],jovem:["📋 O que é esperado de mim pela família e pelas pessoas ao meu redor","o que a família e as pessoas ao redor esperam"],adulto:["📋 O que é esperado de mim pela família e no trabalho","o que a família e o trabalho esperam"]};function Ep(e){let[a,t]=gp[e]||gp.adolescente;return Qg.map(l=>l.id!=="decisao"?l:{...l,opts:l.opts.map(i=>i.v.conformidade===2&&Object.keys(i.v).length===1?{...i,t:a,p:t}:i)})}var Qg=[{id:"conteudo",titulo:"Seu Universo",tipo:"multi",perg:"Que tipo de conteúdo você mais consome? Pode marcar mais de um.",opts:[{t:"🔬 Tech, ciência, como as coisas funcionam",p:"tecnologia e ciência",v:{autodeterminacao:1,estimulacao:1}},{t:"🎨 Arte, música, design e criatividade",p:"arte e criatividade",v:{autodeterminacao:2,hedonismo:1}},{t:"🏋️ Esportes, fitness, aventura e desafios",p:"esportes e aventura",v:{estimulacao:2,realizacao:1}},{t:"💼 Negó
