/* ── Fluid font scale ──────────────────────────────────────────
   clamp(min, preferred, max)
   mobile  : ~18px
   notebook: ~19–20px
   desktop : 20px cap
──────────────────────────────────────────────────────────────── */
html{font-size:clamp(17px, 1.5vw, 20px)}

body{margin:0;background:#F5EFE4;overflow-x:hidden}
*{font-family:'Atkinson Hyperlegible','Verdana',sans-serif;letter-spacing:.03em;word-spacing:.06em;line-height:1.75}
:focus-visible{outline:3px solid #B8862B;outline-offset:3px;border-radius:4px}
:focus:not(:focus-visible){outline:none}
button{min-height:48px;cursor:pointer;border:none}
input{font-family:'Atkinson Hyperlegible','Verdana',sans-serif}
input::placeholder,textarea::placeholder{color:#7A8689}
input,textarea{font-family:'Atkinson Hyperlegible','Verdana',sans-serif}
h1,h2,h3{font-family:'Alegreya',Georgia,serif;letter-spacing:0;word-spacing:0;line-height:1.2}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.print-only{display:none}
#resultado-pdf{display:none}
.pagina{max-width:min(600px,96vw)}
@media(min-width:900px){.pagina{max-width:840px}.pagina-larga{max-width:min(1100px,96vw)}}
.partes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:760px){.partes{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:960px){.mapa-layout{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:32px;align-items:center}}
.top3-grid{display:flex;flex-direction:column;gap:18px}
@media(min-width:1000px){.top3-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}}
.eixos-grid{display:flex;flex-direction:column;gap:20px}
@media(min-width:960px){.eixos-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.leitura{max-width:780px;margin-left:auto;margin-right:auto}
.rel-p{text-align:left}
@media(min-width:640px){.rel-p{text-align:justify}}
@media print{
  @page{size:A4;margin:18mm 16mm}
  body{background:#fff!important}
  body *{visibility:hidden}
  #root *{transform:none!important;filter:none!important;transition:none!important}
  html,body{height:auto!important}
  body[data-print="relatorio"] #relatorio,body[data-print="relatorio"] #relatorio *{visibility:visible}
  body[data-print="relatorio"] #relatorio{position:absolute;left:0;top:0;width:100%;border:none!important;box-shadow:none!important;padding:0!important}
  body[data-print="relatorio"] #resultado-pdf{display:none!important}
  body:not([data-print="relatorio"]) #tela-resultados{display:none!important}
  body:not([data-print="relatorio"]) #resultado-pdf{display:block!important}
  #resultado-pdf,#resultado-pdf *{visibility:visible}
  .quebra{break-before:page}
  .junto{break-inside:avoid}
  .no-print{display:none!important}
  .print-only{display:block!important}
  #relatorio p{orphans:3;widows:3}
  .rel-p{text-align:justify!important}
}

/* ── Tablet / notebook: wider card, bigger breathing room ───── */
@media(min-width:640px){
  html{font-size:clamp(18px,1.4vw,20px)}
}

/* ── Desktop: cap width and center with side padding ─────────  */
@media(min-width:1024px){
  html{font-size:19px}
}

@keyframes popIn{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shimmer{0%{opacity:.6}50%{opacity:1}100%{opacity:.6}}
